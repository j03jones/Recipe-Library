name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - name: Web app scaling matches the Python library
        if: hashFiles('web/data/recipes.json') != ''
        run: python tools/parity_check.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install build tools
        run: python -m pip install --upgrade pip PySide6 pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm --clean --windowed --name RecipeLibrary launch.py

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf RecipeLibrary-linux.tar.gz -C dist RecipeLibrary

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: python -c "import shutil; shutil.make_archive('RecipeLibrary-windows', 'zip', 'dist', 'RecipeLibrary')"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/RecipeLibrary.app RecipeLibrary-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeLibrary-${{ runner.os }}
          path: |
            RecipeLibrary-linux.tar.gz
            RecipeLibrary-windows.zip
            RecipeLibrary-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RecipeLibrary-linux.tar.gz
            RecipeLibrary-windows.zip
            RecipeLibrary-macos.zip
          generate_release_notes: true
